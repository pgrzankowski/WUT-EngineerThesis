models:
  linear_regression:
    class: LinearRegressionModel
    use_log_transform: false
    default_params: {}
    param_grid:
      fit_intercept: [true, false]
  
  elastic_net:
    class: ElasticNetModel
    use_log_transform: false
    default_params:
      alpha: 1.0
      l1_ratio: 0.5
    param_grid:
      # Optuna samples floats between min and max
      alpha: [0.0001, 1.0]      # Wide range: very weak to strong regularization
      l1_ratio: [0.0, 1.0]       # Full range: pure Ridge (0) to pure Lasso (1)
  
  knn:
    class: KNeighborsRegressorModel
    use_log_transform: false 
    default_params:
      n_neighbors: 5
    param_grid:
      n_neighbors: [1, 50]       # Range of neighbors to consider
      weights: ['uniform', 'distance']  # Categorical
      p: [1]
  
  random_forest:
    class: RandomForestRegressorModel
    use_log_transform: false
    default_params:
      n_estimators: 100
      max_depth: null
      min_samples_split: 2
    param_grid:
      n_estimators: [50, 300]    # Number of trees
      max_depth: [5, 50]         # Tree depth (use integers, not null for Optuna)
      min_samples_split: [2, 20] # Min samples to split a node
      min_samples_leaf: [1, 10]  # Min samples in leaf
  
  gradient_boosting:
    class: GradientBoostingRegressorModel
    use_log_transform: false 
    default_params:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
    param_grid:
      n_estimators: [50, 300]    # Number of boosting stages
      learning_rate: [0.01, 0.3] # Step size shrinkage
      max_depth: [3, 10]         # Depth of individual trees
      min_samples_split: [2, 20] # Min samples to split
  
  xgboost:
    class: XGBRegressorModel
    use_log_transform: false
    default_params:
      booster: 'gbtree'
      device: 'cuda'
      verbosity: 1              # Suppress XGBoost output
    param_grid:  # Number of boosting rounds
      learning_rate: [0.01, 1.0] # Boosting learning rate
      max_depth: [6, 20]
      min_child_weight: [1, 10]
      max_delta_step: [0, 10]
      subsample: [0.1, 1.0]
      sampling_method: ['uniform']
  
  lightgbm:
    class: LGBMRegressorModel
    use_log_transform: false
    default_params:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: -1
      verbosity: -1                # Suppress LightGBM output
      early_stopping: 5
    param_grid:
      num_leaves: [20, 300]
      min_data_in_leaf: [10, 100]
      max_depth: [3, 20]
      bagging_freq: [1, 10]
      bagging_fraction: [0.01, 0.99]
  
  svr:
    class: SVRModel
    use_log_transform: false
    default_params:
      kernel: 'rbf'
      C: 1.0
      epsilon: 0.1
    param_grid:
      C: [0.1, 100.0]            # Regularization parameter
      epsilon: [0.01, 1.0]       # Epsilon-tube width
  
  mlp:
    class: MLPRegressorModel
    use_log_transform: false
    default_params:
      hidden_layers: [50, 30, 10]
      dropout: 0.15
      batch_size: 128
      num_epochs: 50
      learning_rate: 0.001
    param_grid:
      hidden_layers:
        - [50, 30, 10]
        - [100, 50, 20]
        - [64, 32, 16]
        - [128, 64, 32]
        - [256, 128, 64]
      dropout: [0.05, 0.3]       # Dropout rate
      learning_rate: [0.0001, 0.01]  # Learning rate
      batch_size: [32, 256]      # Batch size
  
  classical:
    class: ClassicalDiameterModel
    use_log_transform: false
    default_params: {}
    param_grid: {}

# Tuning settings
tuning:
  method: 'optuna'
  cv: 5
  n_iter: 50  # Number of Optuna trials
  scoring: 'neg_mean_squared_error'
  n_jobs: 2  # Safe default to prevent system crashes (avoid -1)
  random_state: 42
  verbose: 1
