models:
  linear_regression:
    class: LinearRegressionModel
    use_log_transform: true
    default_params: {}
    param_grid:
      fit_intercept: [true, false]
      normalize: [false] 
  
  elastic_net:
    class: ElasticNetModel
    use_log_transform: true
    default_params:
      alpha: 1.0
      l1_ratio: 0.5
    param_grid:
      alpha: [0.1, 0.5, 1.0, 2.0]
      l1_ratio: [0.1, 0.3, 0.5, 0.7, 0.9]
  
  knn:
    class: KNeighborsRegressorModel
    use_log_transform: true
    default_params:
      n_neighbors: 1
    param_grid:
      n_neighbors: [3, 5, 7, 10, 15]
      weights: ['uniform', 'distance']
      p: [1, 2]
  
  random_forest:
    class: RandomForestRegressorModel
    use_log_transform: false
    default_params:
      n_estimators: 100
      max_depth: null
      min_samples_split: 2
    param_grid:
      n_estimators: [50, 100, 200]
      max_depth: [10, 20, null]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
  
  gradient_boosting:
    class: GradientBoostingRegressorModel
    use_log_transform: true
    default_params:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
    param_grid:
      n_estimators: [50, 200]
      learning_rate: [0.01, 0.1]
      max_depth: [3, 7]
      min_samples_split: [2, 5]
  
  xgboost:
    class: XGBRegressorModel
    use_log_transform: true
    default_params:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
    param_grid:
      n_estimators: [50, 100, 200]
      learning_rate: [0.01, 0.1, 0.2]
      max_depth: [3, 5, 7]
      min_child_weight: [1, 3, 5]
      subsample: [0.8, 0.9, 1.0]
  
  lightgbm:
    class: LGBMRegressorModel
    use_log_transform: true
    default_params:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
    param_grid:
      n_estimators: [50, 100, 200]
      learning_rate: [0.01, 0.1, 0.2]
      max_depth: [3, 5, 7]
      num_leaves: [31, 50, 100]
      min_child_samples: [20, 30, 50]
  
  svr:
    class: SVRModel
    use_log_transform: true
    default_params:
      kernel: 'rbf'
      C: 1.0
      epsilon: 0.1
    param_grid:
      C: [0.1, 1.0, 10.0, 100.0]
      epsilon: [0.01, 0.1, 0.5]
      kernel: ['rbf', 'linear', 'poly']
      gamma: ['scale', 'auto', 0.001, 0.01]
  
  mlp:
    class: MLPRegressorModel
    use_log_transform: true
    default_params:
      hidden_layers: [50, 30, 10]
      dropout: 0.15
      batch_size: 128
      num_epochs: 50
      learning_rate: 0.001
    param_grid:
      hidden_layers:
        - [50, 30, 10]
        - [100, 50, 20]
        - [64, 32, 16]
      dropout: [0.1, 0.15, 0.2]
      learning_rate: [0.0001, 0.001, 0.01]
      batch_size: [64, 128, 256]
  
  classical:
    class: ClassicalDiameterModel
    use_log_transform: false
    default_params: {}
    param_grid: {}

# Tuning settings
tuning:
  method: 'randomized'  # 'grid', 'randomized', or 'optuna'
  cv: 5
  n_iter: 50  # For RandomizedSearchCV
  scoring: 'neg_mean_squared_error'
  n_jobs: -1
  random_state: 42
  verbose: 1

